  <rect x="0" y="94" width="82" height="82" rx="9" fill="#08265a"/>
  <rect x="94" y="94" width="82" height="82" rx="9" fill="#ffd21f"/>
  <rect x="188" y="94" width="82" height="82" rx="9" fill="#08265a"/>
  <rect x="0" y="188" width="82" height="82" rx="9" fill="#a0003a"/>
